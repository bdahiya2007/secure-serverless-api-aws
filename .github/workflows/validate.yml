name: Validate Terraform and Lambda

# Runs on every pull request targeting main. Fully offline: no AWS credentials, so a
# pull_request-triggered token can never touch AWS. The deploy role's trust policy
# (terraform/bootstrap) deliberately does not authorize pull_request runs.
#
# Kept separate from deploy.yml so a PR check never queues behind a production deploy,
# and so this job's name can be a stable required status check in branch protection.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'

jobs:
  validate:
    name: Validate Terraform and Lambda tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive -diff terraform

      # -backend=false: no state or AWS access is needed to validate the configuration.
      - name: Validate environments/dev
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate bootstrap
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run Lambda unit tests
        run: node --test "src/save-order/*.test.mjs"

      - name: Fail if state or variable files are committed
        run: |
          if git ls-files | grep -E '\.(tfstate|tfvars)(\.|$)|\.tfstate\.backup$'; then
            echo "State or tfvars file is tracked by git" >&2
            exit 1
          fi

  # Backstop for the local pre-commit hook (which can be skipped): scans every tracked file and every
  # line added by every commit in the pull request. Matches are redacted in the log. Optional repository
  # secret SECRET_SCAN_LITERALS (one value per line, e.g. the AWS account ID) adds an exact-match block
  # list; it is empty on fork PRs, where only the built-in rules run.
  secret-scan:
    name: Scan for secrets and sensitive data
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scanner self-test
        run: python3 scripts/secret-scan.py --self-test

      - name: Scan all tracked files
        env:
          SECRET_SCAN_LITERALS: ${{ secrets.SECRET_SCAN_LITERALS }}
        run: python3 scripts/secret-scan.py --all-tracked

      - name: Scan every commit in the pull request
        if: github.event_name == 'pull_request'
        env:
          SECRET_SCAN_LITERALS: ${{ secrets.SECRET_SCAN_LITERALS }}
        run: python3 scripts/secret-scan.py --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
