name: Deploy Terraform

# Authenticates via GitHub OIDC: no long-lived AWS credentials are stored in this repo.
# GitHub Actions assumes AWS_DEPLOY_ROLE_ARN directly; AWS trusts the request based on a
# short-lived token whose "sub" claim is checked against this exact repo (by immutable
# ID) and either the main branch (plan) or the production environment (apply). The role
# is created by terraform/bootstrap, which is applied manually and never by this
# workflow, so the pipeline cannot change its own permissions.
#
# Flow: push to main -> plan (read-only view of the changes) -> manual approval in the
# `production` environment -> apply exactly that saved plan. Lambda packaging is part of
# Terraform (archive_file zips each src/<function> folder; apply updates a function when its code
# hash changes), so there is no separate update-function-code step.
#
# Required GitHub repository secrets (Settings -> Secrets and variables -> Actions):
#   AWS_DEPLOY_ROLE_ARN - the deploy_role_arn output of terraform/bootstrap
#   TF_STATE_BUCKET     - the state_bucket output of terraform/bootstrap (its name contains the
#                         AWS account ID, so it is kept out of the repository)

on:
  push:
    branches:
      - main
    # Only changes that can alter deployed infrastructure or the Lambda code.
    # terraform/bootstrap is intentionally excluded: it is applied manually.
    paths:
      - 'terraform/environments/**'
      - 'terraform/modules/**'
      - 'src/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      enable_api_cache:
        description: 'Provision the API Gateway stage cache (BILLED by the hour, about $0.02 for 0.5 GB; reads can be stale for up to 300 s). Leaving this false REMOVES a cache that was enabled earlier.'
        type: boolean
        default: false
      enable_waf:
        description: 'Attach the WAF rate limit (COSTS about $6/month while attached). Leaving this false REMOVES a WAF that was enabled earlier.'
        type: boolean
        default: false

concurrency:
  group: terraform-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'
  TF_VAR_enable_waf: ${{ inputs.enable_waf || 'false' }}
  TF_VAR_enable_api_cache: ${{ inputs.enable_api_cache || 'false' }}
  WORKDIR: terraform/environments/dev

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # required to request the OIDC token
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ env.WORKDIR }}
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform plan
        working-directory: ${{ env.WORKDIR }}
        run: terraform plan -no-color -out=tfplan

      # The job summary lists only what will change (action + resource address), never ARNs or
      # IDs, because this repository is public. The full plan is in the "Terraform plan" step log.
      # DAX (and its VPC pieces) are a billed demo applied locally: the deploy role has no DAX or EC2 permissions. If they are
      # still in the state, this plan would try to remove them and fail halfway, so stop first with an explanation.
      - name: Stop if DAX is still switched on
        working-directory: ${{ env.WORKDIR }}
        run: |
          n=$(terraform show -json tfplan | jq '[.resource_changes[] | select(.address | test("orders_dax|dax_package_check")) | select(.change.actions != ["no-op"])] | length')
          if [ "$n" -gt 0 ]; then
            echo "::error::DAX resources are in the state and this plan would change them, but the deploy role cannot manage DAX. Turn DAX off locally first (terraform apply without -var enable_dax=true), then re-run."
            exit 1
          fi

      - name: Summarize plan
        working-directory: ${{ env.WORKDIR }}
        run: |
          changes=$(terraform show -json tfplan | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "\(.change.actions | join(",")) \(.address)"')
          {
            echo '## Terraform plan'
            if [ -z "$changes" ]; then
              echo 'No changes.'
            else
              echo '```'
              echo "$changes"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The apply job runs on a fresh machine, so it needs more than the plan: when Terraform creates or updates a
      # Lambda it reads the zip this plan was made with (the plan records the zip's hash). The zips are built by the
      # archive_file data source during plan, into a hidden .build folder, so they are staged here and the artifact
      # must include hidden files. The staged layout mirrors terraform/ so the apply job can unpack it in place.
      - name: Stage plan and Lambda packages
        run: |
          mkdir -p stage/environments/dev stage/modules/lambda-function/.build
          cp "$WORKDIR/tfplan" stage/environments/dev/tfplan
          cp terraform/modules/lambda-function/.build/*.zip stage/modules/lambda-function/.build/

      - name: Upload plan and Lambda packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan
          path: stage
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Terraform apply
    needs: plan
    runs-on: ubuntu-24.04
    # Requires manual approval: the production environment has bdahiya2007 as required
    # reviewer (environment protection is configured via the GitHub API, not in this file).
    # The run pauses here until approved from the Actions tab, after you have read the plan.
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Unpacks the plan to terraform/environments/dev/tfplan and the Lambda zips to terraform/modules/lambda-function/.build/.
      - name: Download plan and Lambda packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan
          path: terraform

      - name: Terraform init
        working-directory: ${{ env.WORKDIR }}
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      # Applies exactly the saved plan. If state changed since the plan, Terraform refuses.
      - name: Terraform apply
        working-directory: ${{ env.WORKDIR }}
        run: terraform apply -no-color tfplan

      - name: Show outputs
        working-directory: ${{ env.WORKDIR }}
        run: terraform output
